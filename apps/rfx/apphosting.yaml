# New app only. Select apps/rfx as the root and attach the existing "RFxchange RFx" Web App.
# App Hosting injects FIREBASE_WEBAPP_CONFIG at build time from that app association.
env:
  - variable: RFXCHANGE_ENV
    value: production
    availability: [BUILD, RUNTIME]
  - variable: RFXCHANGE_EXPECTED_PROJECT_ID
    value: rfxchange
    availability: [BUILD, RUNTIME]
  - variable: RFXCHANGE_FIREBASE_STORAGE_BUCKET
    value: rfxchange.firebasestorage.app
    availability: [RUNTIME]
  - variable: RFX_REQUIRE_CONFIGURATION
    value: "true"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
    secret: rfxchange-mapbox-public-token@1
    availability: [BUILD]
  - variable: RFXCHANGE_LEGACY_EXCHANGE_ORIGIN
    value: https://rfxchange--rfxchange.us-east4.hosted.app
    availability: [BUILD, RUNTIME]
  - variable: RFXCHANGE_PURCHASING_ORIGIN
    value: https://rfxchange-purchasing.web.app
    availability: [BUILD]
  - variable: RFXCHANGE_FOUNDING_CHECKOUT_RELEASE_MODE
    value: closed
    availability: [BUILD, RUNTIME]
  - variable: RFXCHANGE_LIFECYCLE_SEND_MODE
    value: disabled
    availability: [RUNTIME]
# Set RFXCHANGE_PUBLIC_ORIGIN to this backend's actual origin in the Firebase console.
# No Microsoft, Telnyx or Stripe secrets, workers, webhooks, or live sends are duplicated here.
