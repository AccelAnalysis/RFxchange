name: intro-video-storage-policy-repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'control/public-media-intro-rfx-attachments'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply bounded storage policy patch
        run: |
          git config user.name "RFxchange implementation"
          git config user.email "actions@users.noreply.github.com"
          python .github/scripts/add-intro-video-storage-policy.py
