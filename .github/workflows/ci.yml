name: production-ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  remediate-pr247:
    if: github.head_ref == 'control/final-convergence-beacons-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply bounded review remediation
        run: python .github/scripts/remediate-pr247.py
