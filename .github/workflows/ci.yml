name: production-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Repository guardrails
        run: npm run validate
      - name: Firestore rules compile smoke test
        run: npx --yes firebase-tools@15.24.0 emulators:exec --only firestore --project demo-rfxchange "node -e \"console.log('Firestore rules compiled successfully.')\""
      - name: Architecture tests
        run: npm run test:architecture
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
