name: production-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-registration-type-narrowing:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/registration-activation-convergence' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Preserve authoritative organization identity narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/application/onboarding/activation-journey.ts")
          source = path.read_text()
          replacements = [
            (
              '''    if (activation.organizationIdentitySeed.websiteDisposition === null) {
      throw new Error("Confirm the organization website or indicate that no public website applies.");
    }
    const location = await this.dependencies.locations.getByOrganizationId(activation.organizationId);''',
              '''    if (activation.organizationIdentitySeed.websiteDisposition === null) {
      throw new Error("Confirm the organization website or indicate that no public website applies.");
    }
    const organizationId = activation.organizationId;
    const membershipId = activation.membershipId;
    if (!organizationId || !membershipId) {
      throw new ActivationJourneyError(
        "organization-authority-required",
        "Organization authority changed before essential profile completion.",
      );
    }
    const location = await this.dependencies.locations.getByOrganizationId(organizationId);''',
            ),
            (
              '''    const durableProfile = await this.dependencies.profiles.getByOrganizationId(
      activation.organizationId,
    );''',
              '''    const durableProfile = await this.dependencies.profiles.getByOrganizationId(
      organizationId,
    );''',
            ),
            (
              '''      organizationId: String(activation.organizationId),
      membershipId: String(activation.membershipId),
      profile: {''',
              '''      organizationId: String(organizationId),
      membershipId: String(membershipId),
      profile: {''',
            ),
            (
              '''      organizationId: activation.organizationId,
      membershipId: activation.membershipId,
      eventId: this.dependencies.ids.markerEvent(),''',
              '''      organizationId,
      membershipId,
      eventId: this.dependencies.ids.markerEvent(),''',
            ),
          ]
          for before, after in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence, found {count}: {before[:100]!r}")
              source = source.replace(before, after, 1)
          path.write_text(source)
          PY
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/fix-activation-type-narrowing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Narrow activation organization identity after seed persistence"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/registration-activation-convergence' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Repository guardrails
        run: npm run validate
      - name: Cloud Functions build and unit tests
        run: npm run build:functions && npm run test:functions
      - name: Firebase Auth, Firestore, Functions and Storage emulator smoke tests
        env:
          RFXCHANGE_ENV: development
          RFXCHANGE_EXPECTED_PROJECT_ID: demo-rfxchange
          RFXCHANGE_FIREBASE_STORAGE_BUCKET: demo-rfxchange.appspot.com
        run: npx --yes firebase-tools@15.24.0 emulators:exec --only auth,firestore,functions,storage --project demo-rfxchange "node scripts/smoke-firebase-auth-emulator.mjs && node scripts/smoke-firebase-user-resolution-emulator.mjs && node scripts/smoke-firebase-server-session-emulator.mjs && node scripts/smoke-firebase-authentication-lifecycle-emulator.mjs && node scripts/smoke-firebase-auth-firestore-security-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-first-persisted-authenticated-vertical-slice-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-geography-authority-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-organization-resolution-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-organization-authority-claims-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-organization-location-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-essential-organization-profile-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-marker-activation-emulator.mjs && node scripts/smoke-firebase-functions-runtime-emulator.mjs && node scripts/smoke-firebase-background-jobs-emulator.mjs && node scripts/smoke-firebase-storage-emulator.mjs"
      - name: Architecture tests
        run: npm run test:architecture
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
