name: production-ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-provider-seed-permission:
    if: github.head_ref == 'control/hampton-roads-provider-firebase-promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply bounded provider seed authority patch
        run: |
          git config user.name "RFxchange implementation"
          git config user.email "actions@users.noreply.github.com"
          python .github/scripts/patch-provider-seed-permission.py
