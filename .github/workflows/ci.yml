name: production-ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync-pr250:
    if: github.head_ref == 'control/hampton-roads-provider-approval'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Synchronize stacked provider approval packet
        run: |
          git config user.name "RFxchange implementation"
          git config user.email "actions@users.noreply.github.com"
          python .github/scripts/sync-pr250.py
