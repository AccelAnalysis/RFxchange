name: provider-promotion-typecheck-repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'control/hampton-roads-provider-firebase-promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply bounded typecheck repair
        run: |
          git config user.name "RFxchange implementation"
          git config user.email "actions@users.noreply.github.com"
          python .github/scripts/fix-provider-promotion-typecheck.py
