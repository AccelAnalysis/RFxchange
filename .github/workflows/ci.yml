name: production-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Lock Firebase CLI dependency
        run: npm install --save-dev --save-exact firebase-tools@15.24.0
      - name: Commit locked Firebase CLI dependency
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Firebase CLI dependency is already locked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Lock Firebase CLI dependency"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Repository guardrails
        run: npm run validate
      - name: Cloud Functions build and unit tests
        run: npm run build:functions && npm run test:functions
      - name: Firebase Auth, Firestore, Functions and Storage emulator smoke tests
        env:
          RFXCHANGE_ENV: development
          RFXCHANGE_EXPECTED_PROJECT_ID: demo-rfxchange
          RFXCHANGE_FIREBASE_STORAGE_BUCKET: demo-rfxchange.appspot.com
        run: ./node_modules/.bin/firebase emulators:exec --only auth,firestore,functions,storage --project demo-rfxchange "node scripts/smoke-firebase-auth-emulator.mjs && node scripts/smoke-firebase-user-resolution-emulator.mjs && node scripts/smoke-firebase-server-session-emulator.mjs && node scripts/smoke-firebase-authentication-lifecycle-emulator.mjs && node scripts/smoke-firebase-auth-firestore-security-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-first-persisted-authenticated-vertical-slice-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-geography-authority-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-organization-resolution-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-organization-authority-claims-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-organization-location-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-essential-organization-profile-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-marker-activation-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-controlled-network-discovery-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-acquisition-continuity-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-orientation-discovery-team-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-first-value-open-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-ai-amacs-interpretation-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-market-profile-enrichment-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-organization-enrichment-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-referral-network-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-resource-provider-foundation-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-resource-network-emulator.mjs && node --experimental-transform-types --experimental-loader ./scripts/node-typescript-source-loader.mjs scripts/smoke-network-education-emulator.mjs && node scripts/smoke-firebase-functions-runtime-emulator.mjs && node scripts/smoke-firebase-background-jobs-emulator.mjs && node scripts/smoke-transactional-email-reliability-emulator.mjs && node scripts/smoke-firebase-storage-emulator.mjs"
      - name: Architecture tests
        run: npm run test:architecture
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
