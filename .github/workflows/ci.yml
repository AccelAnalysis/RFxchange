name: production-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RFXCHANGE_ENV: development
      RFXCHANGE_EXPECTED_PROJECT_ID: demo-rfxchange
      RFXCHANGE_FIREBASE_STORAGE_BUCKET: demo-rfxchange.appspot.com
      RFXCHANGE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Determine affected checks
        id: scope
        env:
          RFXCHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RFXCHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$RFXCHANGE_BASE_SHA" ] && ! [[ "$RFXCHANGE_BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$RFXCHANGE_BASE_SHA"
          fi
          node scripts/ci-scope.mjs
      - name: Whitespace and source identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test "$(git rev-parse HEAD)" = "$RFXCHANGE_BUILD_SHA"
          if [ -n "$BASE_SHA" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Typecheck all applications
        run: npm run typecheck && npm run typecheck:admin && npm run typecheck:marketing && npm run typecheck:accelpo
      - name: Lint
        run: npm run lint
      - name: Compile Functions once for unit and integration tests
        run: npm run build:functions
      - name: Unit and behavioral tests
        run: npm test && npm run test:functions
      - name: Security configuration and all locale catalogs
        run: npm run validate
      - uses: actions/cache@v4
        if: steps.scope.outputs.browser == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for affected UI checks
        if: steps.scope.outputs.browser == 'true'
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Exchange map and shell lifecycle in Chromium
        if: steps.scope.outputs.browser == 'true'
        run: npm run test:browser
      - uses: actions/setup-java@v4
        if: steps.scope.outputs.firebase == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        if: steps.scope.outputs.firebase == 'true'
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Firebase authorization, tenancy and transaction integration
        env:
          RFXCHANGE_FIREBASE_SMOKES: ${{ steps.scope.outputs.smokes }}
        if: steps.scope.outputs.firebase == 'true'
        run: npm run test:firebase
      - name: Validate Functions deploy installation
        if: steps.scope.outputs.firebase == 'true'
        run: node scripts/verify-functions-deploy-install.mjs
      - name: Production artifacts and HTTP smoke checks
        if: github.event_name != 'pull_request'
        env:
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
        run: npm run check:build
      - name: Verify compiled source identity
        if: github.event_name != 'pull_request'
        run: test "$(cat .next/BUILD_ID)" = "$RFXCHANGE_BUILD_SHA"
