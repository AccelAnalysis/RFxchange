name: provider-promotion-typecheck-diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture typecheck output
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm run typecheck > artifacts/provider-promotion-typecheck.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/provider-promotion-typecheck.status
          cat artifacts/provider-promotion-typecheck.log
      - name: Upload typecheck diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: provider-promotion-typecheck-diagnostics-${{ github.event.pull_request.head.sha }}
          path: artifacts/provider-promotion-typecheck.*
          if-no-files-found: error
          retention-days: 3
