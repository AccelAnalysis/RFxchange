name: production-ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  remediate-pr248:
    if: github.head_ref == 'control/geography-fabric-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply bounded review remediation
        run: |
          git config user.name "RFxchange implementation"
          git config user.email "actions@users.noreply.github.com"
          python .github/scripts/remediate-pr248.py
