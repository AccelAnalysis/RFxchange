name: PR 204 final merge corrections v3

on:
  push:
    branches:
      - fix/wave4-gap-convergence-remaining

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wave4-gap-convergence-remaining
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Apply deterministic patch
        run: python3 scripts/pr204-finalize-alerts.py

      - name: Validate bounded corrections
        run: |
          npm ci
          npm run build:functions
          node --test functions/test/opportunity-alert-locales.test.mjs
          node --test test/pr204-alert-delivery-finalization.test.mjs
          git diff --check

      - name: Commit bounded corrections
        run: |
          git config user.name "RFxchange Control Room"
          git config user.email "actions@users.noreply.github.com"
          git add \
            functions/src/opportunity-discovery-evaluation-functions.ts \
            functions/src/opportunity-discovery-functions.ts \
            src/application/rfx/opportunity-discovery-service.ts
          git commit -m "Finish PR 204 alert delivery integrity"
          git push origin HEAD:fix/wave4-gap-convergence-remaining
