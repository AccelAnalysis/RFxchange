name: temporary-lane01-atomic-lens-hrefs
on:
  push:
    branches: [lane01/exchange-room-phase2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane01/exchange-room-phase2
          fetch-depth: 0
      - name: Normalize atomic href block formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/participant/ParticipantTopNavigation.tsx')
          s = p.read_text()
          old = '''  const serializedLensHrefs = useSyncExternalStore(
          subscribeIntelligenceHref,
          storedLensHrefSnapshot,
          () => DEFAULT_LENS_HREF_SNAPSHOT,
        );
        const {
          intelligenceHref,
          opportunityHref,
          resourceHref,
          referralHref,
        } = JSON.parse(serializedLensHrefs) as ParticipantLensHrefSnapshot;'''
          new = '''  const serializedLensHrefs = useSyncExternalStore(
            subscribeIntelligenceHref,
            storedLensHrefSnapshot,
            () => DEFAULT_LENS_HREF_SNAPSHOT,
          );
          const {
            intelligenceHref,
            opportunityHref,
            resourceHref,
            referralHref,
          } = JSON.parse(serializedLensHrefs) as ParticipantLensHrefSnapshot;'''
          # Python heredoc indentation strips eight YAML spaces but preserves code indentation above.
          old = old.replace('\n        ', '\n')
          new = new.replace('\n          ', '\n  ').replace('\n            ', '\n    ')
          if old not in s:
              # Use exact current block from source when YAML indentation normalization differs.
              start = s.index('  const serializedLensHrefs = useSyncExternalStore(')
              end = s.index('\n\n  useEffect(() => {', start)
              replacement = '''  const serializedLensHrefs = useSyncExternalStore(
    subscribeIntelligenceHref,
    storedLensHrefSnapshot,
    () => DEFAULT_LENS_HREF_SNAPSHOT,
  );
  const {
    intelligenceHref,
    opportunityHref,
    resourceHref,
    referralHref,
  } = JSON.parse(serializedLensHrefs) as ParticipantLensHrefSnapshot;'''
              s = s[:start] + replacement + s[end:]
          else:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit formatting correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/participant/ParticipantTopNavigation.tsx
          git commit -m "Normalize atomic lens href projection"
          git push origin HEAD:lane01/exchange-room-phase2
