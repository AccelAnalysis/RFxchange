name: PR 249 focused-test diagnostic

on:
  push:
    branches:
      - control/geography-fabric-resolver-enrichment

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control/geography-fabric-resolver-enrichment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture focused test output
        shell: bash
        run: |
          set +e
          node --test \
            test/geography-fabric-resolver-enrichment.test.mjs \
            test/hampton-roads-geography-enrichment.test.mjs \
            > pr249-focused-test-log.txt 2>&1
          status=$?
          echo "" >> pr249-focused-test-log.txt
          echo "EXIT_STATUS=$status" >> pr249-focused-test-log.txt
          exit 0
      - name: Commit diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr249-focused-test-log.txt
          git commit -m "Capture PR 249 focused test failure"
          git push origin HEAD:control/geography-fabric-resolver-enrichment
