name: Phase 2 continuity lifecycle reconcile

on:
  push:
    branches:
      - control/exchange-room-phase2-activation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconcile requirement lifecycle and matrix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reqPath = 'governance/four-lens-requirements.json';
          const matrixPath = 'docs/program/PARALLEL_DELIVERY_MATRIX.md';
          const candidateSha = '6f160d84dd0f702e8546cbb421c17b2f3ac56dbd';
          const mergeSha = '10150e66b4a1b37a0cda5381986c5599da96e632';
          const evidence = [
            'https://github.com/AccelAnalysis/RFxchange/pull/160',
            'https://github.com/AccelAnalysis/RFxchange/pull/174',
            'https://github.com/AccelAnalysis/RFxchange/pull/186',
            'https://github.com/AccelAnalysis/RFxchange/actions/runs/31662605471',
            'https://github.com/AccelAnalysis/RFxchange/actions/runs/31687342981',
          ];

          const ledger = JSON.parse(fs.readFileSync(reqPath, 'utf8'));
          const byId = new Map(ledger.requirements.map((record) => [record.id, record]));

          const shared = byId.get('SHARED-CONTINUITY-002');
          if (!shared) throw new Error('Missing SHARED-CONTINUITY-002');
          shared.status = 'Implemented — Not Verified';
          shared.implementation = { actor: 'github:AccelAnalysis', pr: 186, sha: candidateSha };
          shared.acceptance = { lane: null, reviewer: null, sha: null, result: null, evidence };
          shared.clarification = `PR #160 left selectedOrganization continuity partial. PR #186 candidate ${candidateSha} incorporated PR #174 continuity, preserved selectedOrganization through Intelligence search submission, Clear, previous/next pagination and safe return with server revalidation, and merged as ${mergeSha}. Exact-head candidate and post-merge CI passed. Independent acceptance remains pending.`;

          const referral = byId.get('REF-LENS-011');
          if (!referral) throw new Error('Missing REF-LENS-011');
          referral.status = 'Implemented — Not Verified';
          referral.implementation = { actor: 'github:AccelAnalysis', pr: 186, sha: candidateSha };
          referral.acceptance = { lane: null, reviewer: null, sha: null, result: null, evidence };
          referral.clarification = `This requirement was blocked only by the unresolved SHARED-CONTINUITY-002 selectedOrganization loss recorded after PR #160. PR #186 candidate ${candidateSha} corrected that shared continuity seam and merged as ${mergeSha}. Existing Referrals selection/recipient semantics remain server-revalidated; independent acceptance remains pending.`;

          fs.writeFileSync(reqPath, `${JSON.stringify(ledger, null, 2)}\n`);

          let matrix = fs.readFileSync(matrixPath, 'utf8');
          const replacements = [
            ['| Shared Exchange | 27 | 0 | 0 | 21 | 1 | 4 | 1 |', '| Shared Exchange | 27 | 0 | 0 | 22 | 1 | 3 | 1 |'],
            ['| Referrals | 12 | 0 | 0 | 9 | 1 | 2 | 0 |', '| Referrals | 12 | 0 | 0 | 10 | 1 | 1 | 0 |'],
            ['| **Program total** | **106** | **0** | **0** | **64** | **28** | **13** | **1** |', '| **Program total** | **106** | **0** | **0** | **66** | **28** | **11** | **1** |'],
          ];
          for (const [before, after] of replacements) {
            if (!matrix.includes(before)) throw new Error(`Missing matrix row: ${before}`);
            matrix = matrix.replace(before, after);
          }
          const marker = '- Firebase App Hosting rollout for `rfxchange/us-east4/rfxchange` succeeded on that exact SHA.\n';
          const line = '- `SHARED-CONTINUITY-002` and dependent `REF-LENS-011` are now `Implemented — Not Verified` from the PR #186 continuity correction; independent acceptance remains pending.\n';
          if (!matrix.includes(line)) {
            if (!matrix.includes(marker)) throw new Error('Missing Phase 1 matrix marker');
            matrix = matrix.replace(marker, marker + line);
          }
          fs.writeFileSync(matrixPath, matrix);
          NODE

      - name: Validate Four-Lens governance
        run: node scripts/validate-four-lens-program.mjs

      - name: Commit reconciled lifecycle state
        shell: bash
        run: |
          rm -f .github/workflows/phase2-continuity-reconcile.yml
          rm -f docs/program/evidence/exchange-room-phase2/.reconcile-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/four-lens-requirements.json docs/program/PARALLEL_DELIVERY_MATRIX.md .github/workflows/phase2-continuity-reconcile.yml docs/program/evidence/exchange-room-phase2/.reconcile-probe
          git diff --cached --check
          git commit -m "Reconcile Phase 1 continuity lifecycle state"
          git push origin HEAD:${GITHUB_REF_NAME}
