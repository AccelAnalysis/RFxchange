name: source-clean-participant-language

on:
  push:
    branches:
      - fix/multilingual-participant-language-cleanup

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multilingual-participant-language-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Rewrite localized participant sources
        run: node --experimental-transform-types scripts/rewrite-participant-language-sources.mjs --write
      - name: Commit rewritten sources when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source rewrites needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/messages
          git commit -m "Source-clean multilingual participant copy"
          git push origin HEAD:fix/multilingual-participant-language-cleanup
