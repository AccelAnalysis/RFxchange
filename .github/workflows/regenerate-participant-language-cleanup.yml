name: regenerate-participant-language-cleanup

on:
  push:
    branches:
      - fix/multilingual-participant-language-cleanup

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multilingual-participant-language-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Fix localized participant copy artifacts
        run: python scripts/fix-participant-language-artifacts.py
      - name: Commit localized copy fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/participant-language-firewall.ts src/i18n/messages
          if git diff --cached --quiet; then
            echo "No localized copy fixes needed."
            exit 0
          fi
          git commit -m "Finalize localized participant copy"
          git push origin HEAD:fix/multilingual-participant-language-cleanup
