name: temporary-diagnose-phase2-lens-navigation

on:
  push:
    branches:
      - integration/phase2-harness-pr191

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/phase2-harness-pr191
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Apply diagnostic
        run: |
          python scripts/tmp-diagnose-phase2-lens-navigation.py
          node --check scripts/acceptance-exchange-shell-emulator.mjs
          git diff --check
      - name: Commit diagnostic harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/acceptance-exchange-shell-emulator.mjs
          git commit -m "Diagnose delayed Phase 2 lens navigation"
          git push origin HEAD:integration/phase2-harness-pr191
