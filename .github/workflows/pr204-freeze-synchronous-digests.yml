name: PR 204 freeze synchronous digests

on:
  push:
    branches:
      - fix/wave4-gap-convergence-remaining

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wave4-gap-convergence-remaining
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Apply deterministic patch
        run: python3 scripts/pr204-freeze-synchronous-digests.py

      - name: Validate focused correction
        run: |
          npm ci
          npm run typecheck
          node --test test/pr204-alert-delivery-finalization.test.mjs
          git diff --check

      - name: Commit focused correction
        run: |
          git config user.name "RFxchange Control Room"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/infrastructure/firestore/opportunity-discovery.ts \
            test/pr204-alert-delivery-finalization.test.mjs
          git commit -m "Freeze synchronous claimed opportunity digests"
          git push origin HEAD:fix/wave4-gap-convergence-remaining
