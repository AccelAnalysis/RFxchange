# One-shot branch correction; removes itself after applying.
name: Fix activation runner signature

on:
  push:
    branches:
      - codex/registration-activation-convergence
    paths:
      - ".github/workflows/fix-activation-run-signature.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Generalize ignored callback return type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/onboarding/ActivationJourneyClient.tsx")
          source = path.read_text()
          old = "  async function run(task: () => Promise<void>) {"
          new = "  async function run<T>(task: () => Promise<T>): Promise<void> {"
          if source.count(old) != 1:
              raise SystemExit(f"Expected one activation runner signature, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY
          rm .github/workflows/fix-activation-run-signature.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generalize activation runner callback type"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${TARGET_BRANCH}"
