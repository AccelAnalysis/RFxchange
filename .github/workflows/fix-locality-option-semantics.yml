name: Fix locality option semantics

on:
  push:
    branches:
      - codex/registration-activation-convergence
    paths:
      - ".github/workflows/fix-locality-option-semantics.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/registration-activation-convergence
          fetch-depth: 0
      - name: Remove interactive descendants from listbox options
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/onboarding/ActivationJourneyClient.tsx")
          source = path.read_text()
          option_open = '''                    aria-selected={index === activeGeographyIndex}
                    data-active={index === activeGeographyIndex}
                  >'''
          option_replacement = '''                    aria-selected={index === activeGeographyIndex}
                    aria-disabled={busy}
                    data-active={index === activeGeographyIndex}
                    onMouseEnter={() => setActiveGeographyIndex(index)}
                    onMouseDown={(event) => event.preventDefault()}
                    onClick={() => {
                      if (!busy) void run(() => chooseGeography(geography));
                    }}
                  >'''
          button = '''                    <button className={styles.primary} type="button" disabled={busy} onMouseEnter={() => setActiveGeographyIndex(index)} onClick={() => run(() => chooseGeography(geography))}>Use this locality</button>'''
          label = '''                    <span className={styles.secondary} aria-hidden="true">Use this locality</span>'''
          if source.count(option_open) != 1:
              raise SystemExit(f"Expected one locality option opening, found {source.count(option_open)}")
          if source.count(button) != 1:
              raise SystemExit(f"Expected one nested locality button, found {source.count(button)}")
          path.write_text(source.replace(option_open, option_replacement, 1).replace(button, label, 1))
          PY
          rm .github/workflows/fix-locality-option-semantics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix locality combobox option semantics"
          git push origin HEAD:codex/registration-activation-convergence
