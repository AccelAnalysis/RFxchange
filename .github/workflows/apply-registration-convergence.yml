# Applies the reviewed registration-convergence archive to this feature branch.
name: Apply registration convergence

on:
  push:
    branches:
      - codex/registration-activation-convergence
    paths:
      - ".automation/registration-convergence-part*"
      - ".github/workflows/apply-registration-convergence.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared change set
        shell: bash
        run: |
          cat .automation/registration-convergence-part* | base64 --decode > /tmp/registration-convergence.tgz
          echo "b6040b07f3910fa3c283ba544a072e7c6fcb0ad7ea76b5769572331ea3c1ece2  /tmp/registration-convergence.tgz" | sha256sum -c -
          tar -xzf /tmp/registration-convergence.tgz -C .
          rm -f .automation/registration-convergence-part*
          rmdir .automation 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement registration and activation convergence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
