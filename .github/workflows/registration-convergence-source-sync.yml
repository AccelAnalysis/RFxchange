name: Apply registration convergence source sync

on:
  push:
    branches:
      - codex/registration-activation-convergence
    paths:
      - .github/workflows/registration-convergence-source-sync.yml

permissions:
  contents: write

jobs:
  apply-source-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/registration-activation-convergence
          fetch-depth: 0
      - name: Reconcile canonical registration sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          # Canonical dependency authority.
          dep = "docs/tracking/RFxchange_DEPENDENCY_MAP.md"
          replace_exact(
              dep,
              "## Wave 2 Activation dependency corrections — 2026-07-30",
              "## Wave 2 Activation dependency corrections — reviewed 2026-07-30; amended 2026-07-31",
          )
          replace_exact(
