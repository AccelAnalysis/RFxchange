              "- `ORG-012` depends on minimum identity/contact, meaningful capability, service geography, confirmed location and location visibility—not optional organization type, descriptive roles or objectives;\n- `GEO-011` depends on controlled map/release state, confirmed location and legitimate Profile Complete;\n- `EDU-009` follows completed orientation and records a first-value selection; it does not depend on registration-time business objectives;",
