name: PR 204 final merge corrections

on:
  push:
    branches:
      - fix/wave4-gap-convergence-remaining

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wave4-gap-convergence-remaining
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Apply final alert-delivery corrections
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one replacement in {path}: found {count}\n{old[:160]}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          locale_module = Path("functions/src/opportunity-alert-locales.ts")
          locale_module.write_text('''export const OPPORTUNITY_ALERT_LOCALES = [
            "en-US",
            "es",
            "fr",
            "it",
            "de",
          ] as const;

          export type OpportunityAlertLocale =
            (typeof OPPORTUNITY_ALERT_LOCALES)[number];

          interface OpportunityAlertMessageInput {
            readonly recipient: string;
            readonly count: number;
            readonly summary: string;
            readonly continueUrl: string;
          }

          interface OpportunityAlertMessage {
            readonly subject: string;
            readonly text: string;
          }

          type OpportunityAlertMessageFactory = (
            input: OpportunityAlertMessageInput,
          ) => OpportunityAlertMessage;

          const opportunityAlertMessageCatalog: Readonly<
            Record<OpportunityAlertLocale, OpportunityAlertMessageFactory>
          > = Object.freeze({
            "en-US": ({ recipient, count, summary, continueUrl }) => Object.freeze({
              subject: `${count} RFx opportunity update${count === 1 ? "" : "s"}`,
              text: `Hello ${recipient},\n\nA saved RFx search found ${count} currently permitted opportunity update${count === 1 ? "" : "s"}:\n\n${summary}\n\nReview the current details securely: ${continueUrl}\n\nA saved-search match is not qualification, eligibility, endorsement, or an award prediction.`,
            }),
            es: ({ recipient, count, summary, continueUrl }) => Object.freeze({
              subject: `${count} actualización${count === 1 ? "" : "es"} de oportunidades RFx`,
              text: `Hola ${recipient},\n\nUna búsqueda de RFx guardada encontró ${count} ${count === 1 ? "actualización de oportunidad actualmente permitida" : "actualizaciones de oportunidades actualmente permitidas"}:\n\n${summary}\n\nRevise de forma segura los detalles actuales: ${continueUrl}\n\nUna coincidencia de búsqueda guardada no constituye cualificación, elegibilidad, respaldo ni una predicción de adjudicación.`,
            }),
            fr: ({ recipient, count, summary, continueUrl }) => Object.freeze({
              subject: `${count} mise${count === 1 ? "" : "s"} à jour d’opportunité${count === 1 ? "" : "s"} RFx`,
              text: `Bonjour ${recipient},\n\nUne recherche RFx enregistrée a trouvé ${count} ${count === 1 ? "mise à jour d’opportunité actuellement autorisée" : "mises à jour d’opportunités actuellement autorisées"} :\n\n${summary}\n\nConsultez les informations actuelles de manière sécurisée : ${continueUrl}\n\nUne correspondance de recherche enregistrée ne constitue ni une qualification, ni une admissibilité, ni une approbation, ni une prédiction d’attribution.`,
            }),
            it: ({ recipient, count, summary, continueUrl }) => Object.freeze({
              subject: `${count} aggiornamento${count === 1 ? "" : "i"} di opportunità RFx`,
              text: `Ciao ${recipient},\n\nUna ricerca RFx salvata ha trovato ${count} ${count === 1 ? "aggiornamento di opportunità attualmente consentito" : "aggiornamenti di opportunità attualmente consentiti"}:\n\n${summary}\n\nEsamina in modo sicuro i dettagli correnti: ${continueUrl}\n\nUna corrispondenza di ricerca salvata non costituisce qualificazione, idoneità, approvazione o previsione di aggiudicazione.`,
            }),
            de: ({ recipient, count, summary, continueUrl }) => Object.freeze({
              subject: `${count} RFx-Chancenaktualisierung${count === 1 ? "" : "en"}`,
              text: `Hallo ${recipient},\n\nEine gespeicherte RFx-Suche hat ${count} ${count === 1 ? "derzeit zulässige Chancenaktualisierung" : "derzeit zulässige Chancenaktualisierungen"} gefunden:\n\n${summary}\n\nPrüfen Sie die aktuellen Details sicher: ${continueUrl}\n\nEin Treffer einer gespeicherten Suche stellt weder eine Qualifikation noch eine Berechtigung, Empfehlung oder Zuschlagsprognose dar.`,
            }),
          });

          export function normalizeOpportunityAlertLocale(
            value: unknown,
          ): OpportunityAlertLocale {
            const candidate = typeof value === "string" ? value.trim() : "";
            if (candidate === "en-US" || /^en(?:-|$)/i.test(candidate)) return "en-US";
            if (candidate === "es" || /^es(?:-|$)/i.test(candidate)) return "es";
            if (candidate === "fr" || /^fr(?:-|$)/i.test(candidate)) return "fr";
            if (candidate === "it" || /^it(?:-|$)/i.test(candidate)) return "it";
            if (candidate === "de" || /^de(?:-|$)/i.test(candidate)) return "de";
            return "en-US";
          }

          export function renderOpportunityAlertMessage(
            locale: OpportunityAlertLocale,
            input: OpportunityAlertMessageInput,
          ): OpportunityAlertMessage {
            return opportunityAlertMessageCatalog[locale](input);
          }
          ''', encoding="utf-8")

          evaluation_path = Path("functions/src/opportunity-discovery-evaluation-functions.ts")
          replace_once(
              evaluation_path,
              '''function emailRequest(
          ''',
              '''function followUpDailyAlertIdentity(
            search: SavedSearch,
            projection: Projection,
            now: string,
          ) {
            const followUpKey = stableId(
              "followup",
              projection.reference,
              String(projection.aggregateVersion),
              projection.digest,
            ).slice(-16);
            const windowKey = `${now.slice(0, 10)}:follow-up:${followUpKey}`;
            return Object.freeze({
              alertId: stableId(
                "oppalert",
                search.organizationId,
                search.userId,
                windowKey,
              ),
              windowKey,
            });
          }

          function alertFrozen(existing: Record<string, unknown> | undefined): boolean {
            if (!existing) return false;
            const claimId = existing.deliveryClaimId;
            return (
              existing.status !== "queued" ||
              (typeof claimId === "string" && Boolean(claimId.trim())) ||
              Number(existing.attemptCount ?? 0) > 0
            );
          }

          function emailRequest(
          ''',
          )
          replace_once(
              evaluation_path,
              '  const continueUrl = `${new URL(origin).origin}/opportunities?selected=${encodeURIComponent(projection.reference)}`;',
              '  const continueUrl = `${new URL(origin).origin}/opportunities/${encodeURIComponent(projection.reference)}`;',
          )
          replace_once(
              evaluation_path,
              '''  const identity = alertIdentity(search, matchId, now);
            const matchRef = db.collection(MATCHES).doc(matchId);
            const searchRef = db.collection(SEARCHES).doc(search.id);
            const projectionRef = db.collection(PROJECTIONS).doc(projection.reference);
            const membershipRef = db.collection(MEMBERSHIPS).doc(search.membershipId);
            const userRef = db.collection(USERS).doc(search.userId);
            const alertRef = search.alertPolicy === "off"
              ? null
              : db.collection(ALERTS).doc(identity.alertId);
          ''',
              '''  const baseIdentity = alertIdentity(search, matchId, now);
            const matchRef = db.collection(MATCHES).doc(matchId);
            const searchRef = db.collection(SEARCHES).doc(search.id);
            const projectionRef = db.collection(PROJECTIONS).doc(projection.reference);
            const membershipRef = db.collection(MEMBERSHIPS).doc(search.membershipId);
            const userRef = db.collection(USERS).doc(search.userId);
            const baseAlertRef = search.alertPolicy === "off"
              ? null
              : db.collection(ALERTS).doc(baseIdentity.alertId);
          ''',
          )
          replace_once(
              evaluation_path,
              '    const alertSnapshot = alertRef ? await transaction.get(alertRef) : null;',
              '    const baseAlertSnapshot = baseAlertRef ? await transaction.get(baseAlertRef) : null;',
          )
          replace_once(
              evaluation_path,
              '''    let request: ReturnType<typeof emailRequest> | null = null;
          ''',
              '''    let identity = baseIdentity;
            let alertRef = baseAlertRef;
            let alertSnapshot = baseAlertSnapshot;
            const baseExisting = baseAlertSnapshot?.data() as
              | Record<string, unknown>
              | undefined;
            if (
              currentSearch.alertPolicy === "daily-digest" &&
              baseAlertSnapshot?.exists &&
              alertFrozen(baseExisting)
            ) {
              identity = followUpDailyAlertIdentity(currentSearch, currentProjection, now);
              const followUpRef = db.collection(ALERTS).doc(identity.alertId);
              alertRef = followUpRef;
              alertSnapshot = await transaction.get(followUpRef);
            }

            let request: ReturnType<typeof emailRequest> | null = null;
          ''',
          )
          replace_once(
              evaluation_path,
              '        existing?.status !== "queued" ||\n',
              '',
          )
          replace_once(
              evaluation_path,
              '''      const referenceAlreadyPresent = existingReferences.includes(currentProjection.reference);
              const references = [...new Set([
          ''',
              '''      const referenceAlreadyPresent = existingReferences.includes(currentProjection.reference);
              const frozen = alertFrozen(existing);
              if (frozen) {
                if (referenceAlreadyPresent) return;
                throw new Error("Opportunity alert identity collision.");
              }
              const references = [...new Set([
          ''',
          )
          replace_once(
              evaluation_path,
              '''            opportunity_summary: nextSummary,
          ''',
              '''            opportunity_summary: nextSummary,
                      continue_url: String(
                        existingRequest?.variables?.continue_url ??
                        request.variables.continue_url,
                      ),
          ''',
          )

          source_service = Path("src/application/rfx/opportunity-discovery-service.ts")
          replace_once(
              source_service,
              '          const continueUrl = `${new URL(this.publicOrigin).origin}/opportunities?selected=${encodeURIComponent(projection.reference)}`;',
              '          const continueUrl = `${new URL(this.publicOrigin).origin}/opportunities/${encodeURIComponent(projection.reference)}`;',
          )

          delivery_path = Path("functions/src/opportunity-discovery-functions.ts")
          replace_once(
              delivery_path,
              '''import { FirestoreTransactionalEmailDeliveryAuditStore } from "./runtime/firestore-transactional-email-delivery-audit-store.js";
          ''',
              '''import { FirestoreTransactionalEmailDeliveryAuditStore } from "./runtime/firestore-transactional-email-delivery-audit-store.js";
          import {
            normalizeOpportunityAlertLocale,
            renderOpportunityAlertMessage,
          } from "./opportunity-alert-locales.js";
          ''',
          )
          replace_once(
              delivery_path,
              '''  readonly primaryEmail?: string;
            readonly login?: Readonly<{
          ''',
              '''  readonly primaryEmail?: string;
            readonly preferredLocale?: string;
            readonly locale?: string;
            readonly login?: Readonly<{
          ''',
          )
          replace_once(
              delivery_path,
              '''  return Object.freeze({
              subject: `${count} RFx opportunity update`,
              text: `Hello ${recipient},\\n\\nA saved RFx search found ${count} currently permitted opportunity update(s):\\n\\n${summary}\\n\\nReview the current details securely: ${continueUrl}\\n\\nA saved-search match is not qualification, eligibility, endorsement, or an award prediction.`,
            });
          ''',
              '''  return renderOpportunityAlertMessage(
              normalizeOpportunityAlertLocale(request.variables.locale),
              Object.freeze({ recipient, count, summary, continueUrl }),
            );
          ''',
          )
          replace_once(
              delivery_path,
              '''    const providerSubject = user?.login?.provider === "firebase"
              ? user.login.subject?.trim() ?? ""
              : "";
            const searches = searchSnapshots
          ''',
              '''    const providerSubject = user?.login?.provider === "firebase"
              ? user.login.subject?.trim() ?? ""
              : "";
            const deliveryLocale = normalizeOpportunityAlertLocale(
              intent.request.variables.locale ?? user?.preferredLocale ?? user?.locale,
            );
            const searches = searchSnapshots
          ''',
          )
          replace_once(
              delivery_path,
              '''    transaction.set(ref, {
              ...intent,
              deliveryClaimId: claimId,
              deliveryLeaseUntil: Timestamp.fromMillis(now.toMillis() + 5 * 60_000),
              attemptCount: (intent.attemptCount ?? 0) + 1,
              updatedAt: FieldValue.serverTimestamp(),
            });
            return Object.freeze({ intent, claimId, providerSubject });
          ''',
              '''    const claimedRequest = Object.freeze({
              ...intent.request,
              variables: Object.freeze({
                ...intent.request.variables,
                locale: deliveryLocale,
              }),
            });
            const claimedIntent = Object.freeze({
              ...intent,
              request: claimedRequest,
            });
            transaction.set(ref, {
              ...claimedIntent,
              deliveryClaimId: claimId,
              deliveryLeaseUntil: Timestamp.fromMillis(now.toMillis() + 5 * 60_000),
              attemptCount: (intent.attemptCount ?? 0) + 1,
              updatedAt: FieldValue.serverTimestamp(),
            });
            return Object.freeze({
              intent: claimedIntent,
              claimId,
              providerSubject,
            });
          ''',
          )

          Path("functions/test/opportunity-alert-locales.test.mjs").write_text('''import assert from "node:assert/strict";
          import test from "node:test";

          import {
            OPPORTUNITY_ALERT_LOCALES,
            normalizeOpportunityAlertLocale,
            renderOpportunityAlertMessage,
          } from "../lib/opportunity-alert-locales.js";

          test("opportunity alerts support every governed locale with English fallback", () => {
            assert.deepEqual(
              [...OPPORTUNITY_ALERT_LOCALES],
              ["en-US", "es", "fr", "it", "de"],
            );
            assert.equal(normalizeOpportunityAlertLocale("es-MX"), "es");
            assert.equal(normalizeOpportunityAlertLocale("fr-CA"), "fr");
            assert.equal(normalizeOpportunityAlertLocale("unsupported"), "en-US");
            assert.equal(normalizeOpportunityAlertLocale(null), "en-US");
          });

          test("localized alert framing preserves participant-entered opportunity content", () => {
            const summary = "Participant title — 2026-09-01 — Isle of Wight";
            const continueUrl = "https://example.test/opportunities/rfx_123";
            const subjects = new Set();
            for (const locale of OPPORTUNITY_ALERT_LOCALES) {
              const rendered = renderOpportunityAlertMessage(locale, {
                recipient: "Jordan",
                count: 2,
                summary,
                continueUrl,
              });
              subjects.add(rendered.subject);
              assert.match(rendered.text, /Jordan/);
              assert.ok(rendered.text.includes(summary));
              assert.ok(rendered.text.includes(continueUrl));
            }
            assert.equal(subjects.size, OPPORTUNITY_ALERT_LOCALES.length);
          });
          ''', encoding="utf-8")

          Path("test/pr204-alert-delivery-finalization.test.mjs").write_text('''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const read = (path) => readFile(new URL(`../${path}`, import.meta.url), "utf8");

          test("immediate alert creation links through the exact audience-gated opportunity route", async () => {
            const [durable, synchronous] = await Promise.all([
              read("functions/src/opportunity-discovery-evaluation-functions.ts"),
              read("src/application/rfx/opportunity-discovery-service.ts"),
            ]);
            for (const source of [durable, synchronous]) {
              assert.match(
                source,
                /\/opportunities\/\$\{encodeURIComponent\(projection\.reference\)\}/,
              );
              assert.doesNotMatch(
                source,
                /\/opportunities\?selected=\$\{encodeURIComponent\(projection\.reference\)\}/,
              );
            }
          });

          test("delivered opportunity-alert framing is localized and the chosen locale is persisted at claim", async () => {
            const [worker, localeCatalog] = await Promise.all([
              read("functions/src/opportunity-discovery-functions.ts"),
              read("functions/src/opportunity-alert-locales.ts"),
            ]);
            for (const locale of ["en-US", "es", "fr", "it", "de"]) {
              assert.ok(localeCatalog.includes(`"${locale}"`));
            }
            assert.match(worker, /normalizeOpportunityAlertLocale/);
            assert.match(worker, /renderOpportunityAlertMessage/);
            assert.match(
              worker,
              /intent\.request\.variables\.locale \?\? user\?\.preferredLocale \?\? user\?\.locale/,
            );
            assert.match(
              worker,
              /const claimedRequest = Object\.freeze\([\s\S]{0,260}locale: deliveryLocale/,
            );
            assert.match(
              worker,
              /transaction\.set\(ref, \{[\s\S]{0,100}\.\.\.claimedIntent/,
            );
            assert.match(localeCatalog, /return "en-US"/);
          });

          test("claimed or delivered daily digests are frozen and late matches use a deterministic follow-up intent", async () => {
            const durable = await read(
              "functions/src/opportunity-discovery-evaluation-functions.ts",
            );
            assert.match(durable, /function alertFrozen/);
            assert.match(durable, /existing\.status !== "queued"/);
            assert.match(durable, /existing\.deliveryClaimId/);
            assert.match(durable, /Number\(existing\.attemptCount \?\? 0\) > 0/);
            assert.match(durable, /function followUpDailyAlertIdentity/);
            assert.match(durable, /projection\.aggregateVersion/);
            assert.match(durable, /projection\.digest/);
            assert.match(
              durable,
              /baseAlertSnapshot\?\.exists[\s\S]{0,120}alertFrozen\(baseExisting\)[\s\S]{0,260}transaction\.get\(followUpRef\)/,
            );
            assert.match(
              durable,
              /if \(frozen\) \{[\s\S]{0,100}if \(referenceAlreadyPresent\) return/,
            );
          });
          ''', encoding="utf-8")
          PY

      - name: Validate focused corrections
        run: |
          npm ci
          npm run build:functions
          node --test functions/test/opportunity-alert-locales.test.mjs
          node --test test/pr204-alert-delivery-finalization.test.mjs
          git diff --check

      - name: Commit final corrections
        run: |
          git config user.name "RFxchange Control Room"
          git config user.email "actions@users.noreply.github.com"
          git add \
            functions/src/opportunity-alert-locales.ts \
            functions/src/opportunity-discovery-evaluation-functions.ts \
            functions/src/opportunity-discovery-functions.ts \
            functions/test/opportunity-alert-locales.test.mjs \
            src/application/rfx/opportunity-discovery-service.ts \
            test/pr204-alert-delivery-finalization.test.mjs
          git commit -m "Finish PR 204 alert delivery integrity"
          git push origin HEAD:fix/wave4-gap-convergence-remaining
