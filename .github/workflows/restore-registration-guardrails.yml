name: Restore registration guardrails

on:
  push:
    branches:
      - codex/registration-activation-convergence
    paths:
      - ".github/workflows/restore-registration-guardrails.yml"

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/registration-activation-convergence
          fetch-depth: 0
      - name: Restore unrelated validation coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def main_text(path: str) -> str:
              return subprocess.check_output(["git", "show", f"origin/main:{path}"], text=True)

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if source.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, found {source.count(old)}")
              return source.replace(old, new, 1)

          # Design convergence: retain every existing guardrail and change only participant-facing copy.
          path = Path("scripts/validate-design-convergence.mjs")
          source = main_text(str(path))
          source = replace_once(
              source,
              '''assert.ok(
            activationClient.includes("MapboxLocalityCanvas") &&
              activationClient.includes("Confirm this map position") &&
              activationClient.includes("Enter the controlled Exchange"),
            "Integrated activation must preserve geographic confirmation and controlled-workspace handoff without recreating stacked participant shells.",
          );''',
              '''assert.ok(
            activationClient.includes("MapboxLocalityCanvas") &&
              activationClient.includes("Confirm this map position") &&
              activationClient.includes("Enter the Exchange") &&
              activationClient.includes("Your organization is ready"),
            "Integrated activation must preserve geographic confirmation and customer-facing Exchange handoff without recreating stacked participant shells.",
          );
          assert.equal(
            activationClient.toLowerCase().includes("controlled exchange"),
            false,
            "Customer-facing activation copy must not expose internal controlled-platform terminology.",
          );''',
              "design activation copy",
          )
          path.write_text(source)

          # Activation integration: preserve security/runtime/marker/admin checks and update only changed contracts.
          path = Path("scripts/validate-activation-journey-integration.mjs")
          source = main_text(str(path))
          source = replace_once(
              source,
              '''assert.ok(
            signInClient.includes("signInWithEmailAndPassword") &&
              signInClient.includes('window.location.assign("/join")') &&
              signInClient.includes("participantWorkspaceEligible") &&
              signInClient.includes("isAdministrativeReturnTarget") &&
              signInClient.includes("returnTo ?? workspaceUrl") &&
              signInClient.includes("resume exactly where you left"),
            "Returning-user sign in must establish the trusted session, resume incomplete activation, keep admin routing independent, and return lifecycle-eligible participants to the protected target/Exchange.",
          );''',
              '''assert.ok(
            signInClient.includes("signInWithEmailAndPassword") &&
              signInClient.includes('window.location.assign("/join?begin=1")') &&
              signInClient.includes("participantWorkspaceEligible") &&
              signInClient.includes("isAdministrativeReturnTarget") &&
              signInClient.includes("returnTo ?? workspaceUrl") &&
              signInClient.includes("resume exactly where you left"),
            "Returning-user sign in must establish the trusted session, resume incomplete activation, keep admin routing independent, route new accounts to setup, and return lifecycle-eligible participants to the protected target/Exchange.",
          );
          assert.equal(
            signInClient.includes("Organization name"),
            false,
            "Sign in must not ask for an organization name.",
          );''',
              "sign-in contract",
          )
          source = replace_once(
              source,
              '''  "Your real marker is active",
            "ORGANIZATION_PARTICIPATION_ROLES.map",
            "ORGANIZATION_BUSINESS_OBJECTIVES.map",
            "ORGANIZATION_RELATIONSHIPS.map",''',
              '''  "Your real marker is active",
            "ORGANIZATION_RELATIONSHIPS.map",
            "ORGANIZATION_CAPABILITY_CATEGORIES.map",
            'role="combobox"',
            'role="listbox"',
            "AbortController",
            "Your organization is ready",
            "Enter the Exchange",''',
              "activation client requirements",
          )
          source = replace_once(
              source,
              '''    client.includes("reloadCurrentPrincipal") &&
              client.includes("await exchangeSession(state.provisionalOrganizationName)") &&
              client.includes("Firebase still reports this email as unverified"),''',
              '''    client.includes("reloadCurrentPrincipal") &&
              client.includes("await exchangeSession()") &&
              client.includes("Firebase still reports this email as unverified"),''',
              "email verification refresh",
          )
          source = replace_once(
              source,
              '''assert.ok(!client.includes("Harborlight") && !client.includes("200 High St"), "Production activation must not depend on deterministic preview identities.");''',
              '''assert.ok(!client.includes("Harborlight") && !client.includes("200 High St"), "Production activation must not depend on deterministic preview identities.");
          assert.equal(client.includes("ORGANIZATION_PARTICIPATION_ROLES.map"), false, "Activation must not collect permanent participant roles.");
          assert.equal(client.includes("ORGANIZATION_BUSINESS_OBJECTIVES.map"), false, "Activation must not collect business objectives.");
          assert.equal(client.toLowerCase().includes("controlled exchange"), false, "Participant-facing activation copy must not expose internal terminology.");''',
              "activation exclusions",
          )
          source = replace_once(
              source,
              '''  "organizationRelationship",
            "FirestorePlatformAdministratorLifecycleRepository",
            "existingContext || provisionalOrganizationName",''',
              '''  "organizationRelationship",
            "existingContext || provisionalOrganizationName",
            "let state = null",''',
              "session requirements",
          )
          source = replace_once(
              source,
              '''for (const requirement of [
            "issueSessionCookie",
            "csrfVerified: true",
            "ACTIVATION_CSRF_COOKIE",
            "httpOnly: true",
            "createServerActivationJourneyService",
            "organizationRelationship",
            "existingContext || provisionalOrganizationName",
            "let state = null",
          ]) {
            assert.ok(sessionRoute.includes(requirement), `Trusted session exchange is missing ${requirement}.`);
          }''',
              '''for (const requirement of [
            "issueSessionCookie",
            "csrfVerified: true",
            "ACTIVATION_CSRF_COOKIE",
            "httpOnly: true",
            "createServerActivationJourneyService",
            "organizationRelationship",
            "existingContext || provisionalOrganizationName",
            "let state = null",
          ]) {
            assert.ok(sessionRoute.includes(requirement), `Trusted session exchange is missing ${requirement}.`);
          }
          assert.equal(
            sessionRoute.includes("Organization name is required to begin participant activation"),
            false,
            "Session establishment must not require organization context.",
          );''',
              "session exclusion",
          )
          source = replace_once(
              source,
              '''assert.ok(
            activationRoute.includes("CensusTigerLocalityDirectory") &&
              activationRoute.includes("definitions.save(geography)"),
            "Home locality selection must resolve and persist Census authority server-side before lifecycle selection.",
          );''',
              '''assert.ok(
            activationRoute.includes("CensusTigerLocalityDirectory") &&
              activationRoute.includes("definitions.save(geography)"),
            "Home locality selection must resolve and persist Census authority server-side before lifecycle selection.",
          );
          assert.ok(
            activationRoute.includes("LOCALITY_CACHE_TTL_MS") &&
              activationRoute.includes("localitySuggestionCache"),
            "Locality typeahead must use the bounded server-side suggestion cache.",
          );
          assert.equal(activationRoute.includes("participationRoles"), false, "Activation API must not accept participant roles.");
          assert.equal(activationRoute.includes("businessObjectives"), false, "Activation API must not accept business objectives.");''',
              "activation route cache",
          )
          source = replace_once(
              source,
              '''assert.ok(
            coordinator.includes("orientationBridgeAcknowledgedAt") && !coordinator.includes("EDU-001") && !coordinator.includes("EDU-008"),
            "Orientation bridge must preserve runtime position without writing EDU completion.",
          );''',
              '''assert.ok(
            coordinator.includes("orientationBridgeAcknowledgedAt") && !coordinator.includes("EDU-001") && !coordinator.includes("EDU-008"),
            "Orientation bridge must preserve runtime position without writing EDU completion.",
          );
          assert.ok(
            coordinator.includes("organizationIdentitySeed") &&
              coordinator.includes("profileSeed") &&
              coordinator.includes("context.user.name") &&
              coordinator.includes("context.user.primaryEmail") &&
              coordinator.includes("normalizedWebsiteUrl") &&
              coordinator.includes("https://${normalized}"),
            "Activation must carry, normalize, and reuse authoritative organization identity and contact data.",
          );
          assert.equal(coordinator.includes("participationRoles:"), false, "Activation coordinator must not persist participant-role selections.");
          assert.equal(coordinator.includes("businessObjectives:"), false, "Activation coordinator must not persist objective selections.");''',
              "coordinator convergence",
          )
          source = replace_once(
              source,
              '''  "organizationRelationship",
            "Descriptive onboarding metadata only",''',
              '''  "organizationRelationship",
            "organizationIdentitySeed",
            "Descriptive onboarding metadata only",''',
              "activation context seed",
          )
          source = replace_once(
              source,
              '''  "spatial activation background",
          ]) {''',
              '''  "spatial activation background",
            "every activated organization can both issue and respond",
            "official resource provider boundary",
            "customer-facing terminology",
          ]) {''',
              "architecture phrases",
          )
          source = replace_once(
              source,
              '''canonical roles/objectives/relationship metadata, and controlled-platform stop.''',
              '''categorized capabilities, universal opportunity participation, carried identity, and controlled-platform stop.''',
              "validation summary",
          )
          path.write_text(source)

          # Essential profile validation: retain persistence/security/CI checks and update only the profile contract.
          path = Path("scripts/validate-essential-organization-profile.mjs")
          source = main_text(str(path))
          source = replace_once(
              source,
              '''  "ORGANIZATION_CAPABILITY_KINDS",
            "PROFILE_COMPLETION_REQUIREMENTS",''',
              '''  "ORGANIZATION_CAPABILITY_KINDS",
            "ORGANIZATION_CAPABILITY_CATEGORIES",
            "PROFILE_COMPLETION_REQUIREMENTS",''',
              "capability category constant",
          )
          source = replace_once(
              source,
              '''assert.ok(model.includes("GENERIC_CAPABILITY_NAMES"));''',
              '''for (const category of [
            "professional-business-services",
            "construction-skilled-trades",
            "manufacturing-fabrication",
            "technology-data-cybersecurity",
            "transportation-logistics",
            "marketing-creative-services",
            "facilities-real-estate",
            "education-workforce-training",
            "health-safety-security",
            "food-hospitality-events",
            "other",
          ]) {
            assert.ok(model.includes(`"${category}"`), `Capability category is missing ${category}.`);
          }
          assert.ok(model.includes("GENERIC_CAPABILITY_NAMES"));''',
              "capability categories",
          )
          source = replace_once(
              source,
              '''for (const required of [
            "Minimum organization identity",
            "One meaningful capability",
            "Participation roles",
            "Business objectives",
            "Active credential · automatically derived",
            "Profile Complete is not Organization Verified",
            "not an activated network marker",
          ]) {
            assert.ok(panel.includes(required), `Reference essential-profile component is missing ${required}.`);
          }''',
              '''for (const required of [
            "Carried-forward organization information",
            "One meaningful capability",
            "Capability category",
            "Other category",
            "Active credential · automatically derived",
            "Profile Complete is not Organization Verified",
            "not an activated network marker",
          ]) {
            assert.ok(panel.includes(required), `Reference essential-profile component is missing ${required}.`);
          }
          assert.equal(panel.includes("<legend>Participation roles</legend>"), false);
          assert.equal(panel.includes("<legend>Business objectives</legend>"), false);''',
              "reference panel",
          )
          source = replace_once(
              source,
              '''for (const required of [
            "resolveParticipantRoute",
            "hydrateEssentialOrganizationProfile",
            "getByOrganizationId",
            "Profile Complete",
            "Participation roles",
            "Business objectives",
          ]) {
            assert.ok(route.includes(required), `Authenticated Account profile route is missing ${required}.`);
          }''',
              '''for (const required of [
            "resolveParticipantRoute",
            "hydrateEssentialOrganizationProfile",
            "getByOrganizationId",
            "Profile Complete",
            "Opportunity participation",
            "Resource Provider status",
            "capability.category",
          ]) {
            assert.ok(route.includes(required), `Authenticated Account profile route is missing ${required}.`);
          }
          assert.equal(route.includes("<h2>Participation roles</h2>"), false);
          assert.equal(route.includes("<h2>Business objectives</h2>"), false);''',
              "account route",
          )
          source = replace_once(
              source,
              '''for (const required of [
            "ORGANIZATION_PARTICIPATION_ROLES.map",
            "ORGANIZATION_BUSINESS_OBJECTIVES.map",
            '"save-profile"',
            "Complete profile and activate marker",
          ]) {
            assert.ok(activationUi.includes(required), `Integrated essential-profile activation UI is missing ${required}.`);
          }''',
              '''for (const required of [
            "ORGANIZATION_CAPABILITY_CATEGORIES.map",
            "Capability category",
            "Other category",
            '"save-profile"',
            "Complete profile and activate marker",
          ]) {
            assert.ok(activationUi.includes(required), `Integrated essential-profile activation UI is missing ${required}.`);
          }
          assert.equal(activationUi.includes("ORGANIZATION_PARTICIPATION_ROLES.map"), false);
          assert.equal(activationUi.includes("ORGANIZATION_BUSINESS_OBJECTIVES.map"), false);''',
              "activation profile UI",
          )
          path.write_text(source)

          # Runtime convergence: restore unrelated admin and organization-relationship assertions.
          path = Path("test/runtime-convergence.test.mjs")
          source = path.read_text()
          source = replace_once(
              source,
              '''  assert.match(runtime, /listByAdministratorId/);
            assert.doesNotMatch(runtime, /isAdmin/);
          });''',
              '''  assert.match(runtime, /listByAdministratorId/);
            assert.doesNotMatch(runtime, /isAdmin/);

            const claims = await source("app/admin/organization-claims/page.tsx");
            assert.match(claims, /organization\\.claim\\.read/);
            assert.match(claims, /GEOGRAPHY:/);
            assert.doesNotMatch(claims, /Harborlight/i);

            const organization360 = await source("app/admin/organizations/[organizationId]/page.tsx");
            assert.match(organization360, /organization\\.profile\\.read/);
            assert.match(organization360, /ORGANIZATION:/);
            assert.match(organization360, /buildOrganization360/);
            assert.doesNotMatch(organization360, /createPortsmouthOrganization360Preview/);
          });''',
              "admin runtime assertions",
          )
          source = replace_once(
              source,
              '''  assert.match(signIn, /ActivationJourneyState \\| null/);
            assert.match(signIn, /\\/join\\?begin=1/);''',
              '''  assert.match(signIn, /ActivationJourneyState \\| null/);
            assert.match(signIn, /returnTo === "\\/admin"/);
            assert.match(signIn, /\\/join\\?begin=1/);''',
              "admin sign-in routing",
          )
          source = replace_once(
              source,
              '''test("activation context carries organization identity signals forward", async () => {''',
              '''test("organization relationship metadata is descriptive and persisted separately from authorization", async () => {
            const onboarding = await source("src/domain/onboarding/model.ts");
            assert.match(onboarding, /ORGANIZATION_RELATIONSHIPS/);
            assert.match(onboarding, /Descriptive onboarding metadata only/);
            assert.match(onboarding, /durable control continues to require membership \\+ authorization establishment/);
            const session = await source("app/api/auth/session/route.ts");
            assert.match(session, /organizationRelationship/);
            assert.match(session, /updateActivationJourneyContext/);
          });

          test("activation context carries organization identity signals forward", async () => {''',
              "relationship metadata test",
          )
          path.write_text(source)
          PY
          node --check scripts/validate-design-convergence.mjs
          node --check scripts/validate-activation-journey-integration.mjs
          node --check scripts/validate-essential-organization-profile.mjs
          node --check test/runtime-convergence.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-design-convergence.mjs scripts/validate-activation-journey-integration.mjs scripts/validate-essential-organization-profile.mjs test/runtime-convergence.test.mjs
          git commit -m "Preserve unrelated registration convergence guardrails"
          git push origin HEAD:codex/registration-activation-convergence
