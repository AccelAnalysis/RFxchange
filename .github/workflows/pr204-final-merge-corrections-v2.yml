name: PR 204 final merge corrections v2

on:
  push:
    branches:
      - fix/wave4-gap-convergence-remaining

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wave4-gap-convergence-remaining
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Apply bounded source patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"Expected one marker in {path}, found {count}: {old[:180]!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          evaluation = Path("functions/src/opportunity-discovery-evaluation-functions.ts")
          replace_once(
              evaluation,
              "function emailRequest(\n",
              '''function followUpDailyAlertIdentity(
            search: SavedSearch,
            projection: Projection,
            now: string,
          ) {
            const followUpKey = stableId(
              "followup",
              projection.reference,
              String(projection.aggregateVersion),
              projection.digest,
            ).slice(-16);
            const windowKey = `${now.slice(0, 10)}:follow-up:${followUpKey}`;
            return Object.freeze({
              alertId: stableId(
                "oppalert",
                search.organizationId,
                search.userId,
                windowKey,
              ),
              windowKey,
            });
          }

          function alertFrozen(existing: Record<string, unknown> | undefined): boolean {
            if (!existing) return false;
            const claimId = existing.deliveryClaimId;
            return (
              existing.status !== "queued" ||
              (typeof claimId === "string" && Boolean(claimId.trim())) ||
              Number(existing.attemptCount ?? 0) > 0
            );
          }

          function emailRequest(
          ''',
          )
          replace_once(
              evaluation,
              '  const continueUrl = `${new URL(origin).origin}/opportunities?selected=${encodeURIComponent(projection.reference)}`;',
              '  const continueUrl = `${new URL(origin).origin}/opportunities/${encodeURIComponent(projection.reference)}`;',
          )
          replace_once(
              evaluation,
              '''  const identity = alertIdentity(search, matchId, now);
            const matchRef = db.collection(MATCHES).doc(matchId);
            const searchRef = db.collection(SEARCHES).doc(search.id);
            const projectionRef = db.collection(PROJECTIONS).doc(projection.reference);
            const membershipRef = db.collection(MEMBERSHIPS).doc(search.membershipId);
            const userRef = db.collection(USERS).doc(search.userId);
            const alertRef = search.alertPolicy === "off"
              ? null
              : db.collection(ALERTS).doc(identity.alertId);
          ''',
              '''  const baseIdentity = alertIdentity(search, matchId, now);
            const matchRef = db.collection(MATCHES).doc(matchId);
            const searchRef = db.collection(SEARCHES).doc(search.id);
            const projectionRef = db.collection(PROJECTIONS).doc(projection.reference);
            const membershipRef = db.collection(MEMBERSHIPS).doc(search.membershipId);
            const userRef = db.collection(USERS).doc(search.userId);
            const baseAlertRef = search.alertPolicy === "off"
              ? null
              : db.collection(ALERTS).doc(baseIdentity.alertId);
          ''',
          )
          replace_once(
              evaluation,
              "    const alertSnapshot = alertRef ? await transaction.get(alertRef) : null;",
              "    const baseAlertSnapshot = baseAlertRef ? await transaction.get(baseAlertRef) : null;",
          )
          replace_once(
              evaluation,
              "    let request: ReturnType<typeof emailRequest> | null = null;\n",
              '''    let identity = baseIdentity;
            let alertRef = baseAlertRef;
            let alertSnapshot = baseAlertSnapshot;
            const baseExisting = baseAlertSnapshot?.data() as
              | Record<string, unknown>
              | undefined;
            if (
              currentSearch.alertPolicy === "daily-digest" &&
              baseAlertSnapshot?.exists &&
              alertFrozen(baseExisting)
            ) {
              identity = followUpDailyAlertIdentity(currentSearch, currentProjection, now);
              const followUpRef = db.collection(ALERTS).doc(identity.alertId);
              alertRef = followUpRef;
              alertSnapshot = await transaction.get(followUpRef);
            }

            let request: ReturnType<typeof emailRequest> | null = null;
          ''',
          )
          replace_once(evaluation, '        existing?.status !== "queued" ||\n', "")
          replace_once(
              evaluation,
              '''      const referenceAlreadyPresent = existingReferences.includes(currentProjection.reference);
              const references = [...new Set([
          ''',
              '''      const referenceAlreadyPresent = existingReferences.includes(currentProjection.reference);
              const frozen = alertFrozen(existing);
              if (frozen) {
                if (referenceAlreadyPresent) return;
                throw new Error("Opportunity alert identity collision.");
              }
              const references = [...new Set([
          ''',
          )
          replace_once(
              evaluation,
              "            opportunity_summary: nextSummary,\n",
              '''            opportunity_summary: nextSummary,
                      continue_url: String(
                        existingRequest?.variables?.continue_url ??
                        request.variables.continue_url,
                      ),
          ''',
          )

          service = Path("src/application/rfx/opportunity-discovery-service.ts")
          replace_once(
              service,
              '          const continueUrl = `${new URL(this.publicOrigin).origin}/opportunities?selected=${encodeURIComponent(projection.reference)}`;',
              '          const continueUrl = `${new URL(this.publicOrigin).origin}/opportunities/${encodeURIComponent(projection.reference)}`;',
          )

          worker = Path("functions/src/opportunity-discovery-functions.ts")
          replace_once(
              worker,
              'import { FirestoreTransactionalEmailDeliveryAuditStore } from "./runtime/firestore-transactional-email-delivery-audit-store.js";\n',
              '''import { FirestoreTransactionalEmailDeliveryAuditStore } from "./runtime/firestore-transactional-email-delivery-audit-store.js";
          import {
            normalizeOpportunityAlertLocale,
            renderOpportunityAlertMessage,
          } from "./opportunity-alert-locales.js";
          ''',
          )
          replace_once(
              worker,
              '''  readonly primaryEmail?: string;
            readonly login?: Readonly<{
          ''',
              '''  readonly primaryEmail?: string;
            readonly preferredLocale?: string;
            readonly locale?: string;
            readonly login?: Readonly<{
          ''',
          )
          replace_once(
              worker,
              '''  return Object.freeze({
              subject: `${count} RFx opportunity update`,
              text: `Hello ${recipient},\\n\\nA saved RFx search found ${count} currently permitted opportunity update(s):\\n\\n${summary}\\n\\nReview the current details securely: ${continueUrl}\\n\\nA saved-search match is not qualification, eligibility, endorsement, or an award prediction.`,
            });
          ''',
              '''  return renderOpportunityAlertMessage(
              normalizeOpportunityAlertLocale(request.variables.locale),
              Object.freeze({ recipient, count, summary, continueUrl }),
            );
          ''',
          )
          replace_once(
              worker,
              '''    const providerSubject = user?.login?.provider === "firebase"
              ? user.login.subject?.trim() ?? ""
              : "";
            const searches = searchSnapshots
          ''',
              '''    const providerSubject = user?.login?.provider === "firebase"
              ? user.login.subject?.trim() ?? ""
              : "";
            const deliveryLocale = normalizeOpportunityAlertLocale(
              intent.request.variables.locale ?? user?.preferredLocale ?? user?.locale,
            );
            const searches = searchSnapshots
          ''',
          )
          replace_once(
              worker,
              '''    transaction.set(ref, {
              ...intent,
              deliveryClaimId: claimId,
              deliveryLeaseUntil: Timestamp.fromMillis(now.toMillis() + 5 * 60_000),
              attemptCount: (intent.attemptCount ?? 0) + 1,
              updatedAt: FieldValue.serverTimestamp(),
            });
            return Object.freeze({ intent, claimId, providerSubject });
          ''',
              '''    const claimedRequest = Object.freeze({
              ...intent.request,
              variables: Object.freeze({
                ...intent.request.variables,
                locale: deliveryLocale,
              }),
            });
            const claimedIntent = Object.freeze({
              ...intent,
              request: claimedRequest,
            });
            transaction.set(ref, {
              ...claimedIntent,
              deliveryClaimId: claimId,
              deliveryLeaseUntil: Timestamp.fromMillis(now.toMillis() + 5 * 60_000),
              attemptCount: (intent.attemptCount ?? 0) + 1,
              updatedAt: FieldValue.serverTimestamp(),
            });
            return Object.freeze({
              intent: claimedIntent,
              claimId,
              providerSubject,
            });
          ''',
          )
          PY

      - name: Validate bounded corrections
        run: |
          npm ci
          npm run build:functions
          node --test functions/test/opportunity-alert-locales.test.mjs
          node --test test/pr204-alert-delivery-finalization.test.mjs
          git diff --check

      - name: Commit bounded corrections
        run: |
          git config user.name "RFxchange Control Room"
          git config user.email "actions@users.noreply.github.com"
          git add \
            functions/src/opportunity-discovery-evaluation-functions.ts \
            functions/src/opportunity-discovery-functions.ts \
            src/application/rfx/opportunity-discovery-service.ts
          git commit -m "Finish PR 204 alert delivery integrity"
          git push origin HEAD:fix/wave4-gap-convergence-remaining
