name: Normalize registration website seed

on:
  push:
    branches:
      - codex/registration-activation-convergence
    paths:
      - ".github/workflows/normalize-registration-website.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/registration-activation-convergence
          fetch-depth: 0
      - name: Normalize and persist website URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/application/onboarding/activation-journey.ts")
          source = path.read_text()

          old_helper = '''function domainFromWebsite(websiteUrl: string | null): string | null {
            if (!websiteUrl) return null;
            const hostname = new URL(websiteUrl).hostname.toLowerCase().replace(/^www\\./, "");
            return hostname || null;
          }
          '''
          new_helper = '''function normalizedWebsiteUrl(value: string): string {
            const normalized = value.trim();
            const candidate = /^[a-z][a-z0-9+.-]*:/i.test(normalized)
              ? normalized
              : `https://${normalized}`;
            const parsed = new URL(candidate);
            if (!["http:", "https:"].includes(parsed.protocol)) {
              throw new Error("Organization website must use HTTP or HTTPS.");
            }
            parsed.hash = "";
            return parsed.toString();
          }

          function domainFromWebsite(websiteUrl: string | null): string | null {
            if (!websiteUrl) return null;
            const hostname = new URL(websiteUrl).hostname.toLowerCase().replace(/^www\\./, "");
            return hostname || null;
          }
          '''
          old_seed = '''    const website = input.website?.trim() ?? "";
              const updated = updateActivationJourneyContext(activation, {
                organizationIdentitySeed: {
                  websiteDisposition: input.websiteNotApplicable
                    ? "not-applicable"
                    : website
                      ? "available"
                      : null,
                  websiteUrl: website || null,
          '''
          new_seed = '''    const website = input.website?.trim() ?? "";
              const websiteUrl = input.websiteNotApplicable || !website
                ? null
                : normalizedWebsiteUrl(website);
              const updated = updateActivationJourneyContext(activation, {
                organizationIdentitySeed: {
                  websiteDisposition: input.websiteNotApplicable
                    ? "not-applicable"
                    : websiteUrl
                      ? "available"
                      : null,
                  websiteUrl,
          '''

          if old_helper not in source:
            raise SystemExit("Expected website helper was not found.")
          if old_seed not in source:
            raise SystemExit("Expected identity seed block was not found.")

          path.write_text(source.replace(old_helper, new_helper).replace(old_seed, new_seed))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/onboarding/activation-journey.ts
          git commit -m "Normalize carried-forward organization websites"
          git push origin HEAD:codex/registration-activation-convergence
