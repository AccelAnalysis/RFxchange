name: temporary-phase2-harness-source-patch

on:
  push:
    branches:
      - control/phase2-configured-browser-harness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control/phase2-configured-browser-harness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Apply bounded harness correction
        run: |
          python scripts/tmp-phase2-harness-patch.py
          node --check scripts/acceptance-exchange-shell-emulator.mjs
          git diff --check
      - name: Commit canonical harness correction
        run: |
          if git diff --quiet; then
            echo "Harness already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/acceptance-exchange-shell-emulator.mjs
          git commit -m "Reconcile configured browser harness with Phase 2"
          git push origin HEAD:control/phase2-configured-browser-harness
