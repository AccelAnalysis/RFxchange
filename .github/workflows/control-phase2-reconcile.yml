name: control-phase2-governance-reconcile

on:
  push:
    branches:
      - control/exchange-room-phase2-activation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control/exchange-room-phase2-activation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Reconcile Phase 2 governance
        run: node scripts/control-phase2-activation-reconcile.mjs
      - name: Validate Four-Lens governance
        run: node scripts/validate-four-lens-program.mjs
      - name: Validate patch integrity
        run: git diff --check
      - name: Remove one-shot reconciliation machinery
        run: |
          rm scripts/control-phase2-activation-reconcile.mjs
          rm .github/workflows/control-phase2-reconcile.yml
      - name: Commit reconciled governance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile Phase 2 activation governance"
          git push origin HEAD:control/exchange-room-phase2-activation
